# bora's opinionated Ghostty layer (macOS).
#
# Managed by `just install` (component `ghostty`): it is copied to
# ~/.config/ghostty/bora.conf and REWRITTEN on every install, so do not edit
# that copy. Your own config pulls it in with
#
#   config-file = ?bora.conf
#
# Ghostty loads an included file after the file that includes it, so these
# values win over your config. To override one, include a file of your own
# after this line (e.g. `config-file = ?local.conf`) and set it there.
# Check with: ghostty +validate-config --config-file=<this file>

# ── Look ────────────────────────────────────────────────────────────────────
# The "Mono" Nerd Font variant keeps icons single-width. A family that is not
# installed falls back to Ghostty's default silently (`ghostty +list-fonts`).
font-family = JetBrainsMono Nerd Font Mono
# Native titlebar with native tabs. `hidden` disables native tabs entirely
# (new_tab opens a window). Applies to new windows only: quit and relaunch.
macos-titlebar-style = transparent
background-opacity = 1

# ── Option is Alt ───────────────────────────────────────────────────────────
# Without this macOS composes alt+a into "å", and bora's alt+... bindings
# (next_agent, focus_agent alt+1..9) never fire. New windows only.
macos-option-as-alt = true

# ── Hand Cmd chords to bora ─────────────────────────────────────────────────
# Ghostty binds these chords to its own tab/window actions and consumes them
# before the program inside sees them. Unbinding lets the real key event
# reach bora over the kitty keyboard protocol, where the bora config binds
# them (examples/opinionated/config.toml):
#   cmd+t new_tab         cmd+d split_vertical    cmd+shift+d split_horizontal
#   cmd+w close_pane      cmd+n new_workspace     cmd+shift+g new_worktree
#   cmd+] / cmd+[         next / previous tab
#   cmd+shift+] / [       next / previous workspace (ctrl+tab / ctrl+shift+tab too)
# The rest (cmd+g, cmd+1..9, cmd+enter, cmd+shift+t/w, cmd+shift+,) are freed
# for your own bora [[keys.command]] bindings or the app in the pane.
keybind = cmd+t=unbind
keybind = cmd+w=unbind
keybind = cmd+n=unbind
keybind = cmd+d=unbind
keybind = cmd+shift+d=unbind
keybind = cmd+shift+g=unbind
keybind = cmd+g=unbind
keybind = ctrl+tab=unbind
keybind = ctrl+shift+tab=unbind
# Key names are the literal `]` / `[`. `right_bracket` does not exist and
# Ghostty ignores such a line silently, even under +validate-config.
keybind = cmd+]=unbind
keybind = cmd+[=unbind
keybind = cmd+shift+]=unbind
keybind = cmd+shift+[=unbind
# Freeing cmd+shift+] / [ / , fully also needs the macOS menu items
# "Show Next Tab", "Show Previous Tab" and "Reload Configuration" remapped:
# menu shortcuts resolve before Ghostty's keybind table. See step 4 of
# examples/README.md (NSUserKeyEquivalents).
keybind = cmd+shift+,=unbind
# Ghostty registers digits under two spellings (`cmd+1` and `cmd+digit_1`);
# unbinding only one leaves the other switching Ghostty tabs.
keybind = cmd+1=unbind
keybind = cmd+2=unbind
keybind = cmd+3=unbind
keybind = cmd+4=unbind
keybind = cmd+5=unbind
keybind = cmd+6=unbind
keybind = cmd+7=unbind
keybind = cmd+8=unbind
keybind = cmd+9=unbind
keybind = cmd+digit_1=unbind
keybind = cmd+digit_2=unbind
keybind = cmd+digit_3=unbind
keybind = cmd+digit_4=unbind
keybind = cmd+digit_5=unbind
keybind = cmd+digit_6=unbind
keybind = cmd+digit_7=unbind
keybind = cmd+digit_8=unbind
keybind = cmd+enter=unbind
# Unbinding cmd+shift+t/w alone would let Ghostty's defaults (undo,
# close_window) reappear on them.
keybind = cmd+shift+t=unbind
keybind = cmd+shift+w=unbind

# ── Ghostty's own window/tab level: cmd+ctrl ────────────────────────────────
# cmd / cmd+shift belong to bora; Ghostty's window and tab actions move here.
keybind = cmd+ctrl+t=new_tab
keybind = cmd+ctrl+n=new_window
keybind = cmd+ctrl+w=close_window
keybind = cmd+ctrl+shift+w=close_surface
keybind = cmd+ctrl+1=goto_tab:1
keybind = cmd+ctrl+2=goto_tab:2
keybind = cmd+ctrl+3=goto_tab:3
keybind = cmd+ctrl+4=goto_tab:4
keybind = cmd+ctrl+5=goto_tab:5
keybind = cmd+ctrl+6=goto_tab:6
keybind = cmd+ctrl+7=goto_tab:7
keybind = cmd+ctrl+8=goto_tab:8
keybind = cmd+ctrl+9=last_tab
keybind = cmd+ctrl+enter=toggle_fullscreen

# ── Cmd+Z undoes typing ─────────────────────────────────────────────────────
# Sends Ctrl+_ (0x1f), which is undo in omp, Claude Code and readline/zsh and
# needs no kitty protocol. Ghostty's default cmd+z (reopen closed tab) is
# lost. Pairs with the omp extension github:aryrabelo/omp-cmd-z-undo, which
# also routes ctrl+z to undo inside omp.
keybind = cmd+z=text:\x1f
