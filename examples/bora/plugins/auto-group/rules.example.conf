# auto-group rules. Copy this file to
#   $(bora plugin config-dir ary.auto-group)/rules.conf
# and edit. One rule per line:  <pattern> = <group>
#
# - No "/" in the pattern and not starting with "~": a glob against the repo NAME
#   (folder name of the main repo; linked worktrees use their main repo's name).
# - Otherwise: a glob against the repo ROOT path ("~" is expanded, a trailing "/"
#   is ignored). "*" also matches "/", so "~/Sites/pp/*" covers nested folders.
# - Matching is case-insensitive. The FIRST matching rule wins, so put the
#   specific rules first.
# - The group is everything after the first "=", trimmed. "/" nests
#   ("pp/docs" is folder "docs" inside "pp"). Spaces are allowed.
# - Blank lines and lines starting with "#" are ignored. A malformed line is
#   skipped and reported (see `python3 autogroup.py check`).
#
# postpilot*                 = pp
# ~/Sites/postpilot/docs*    = pp/docs
# ~/Sites/bora-team/*        = bora team
# *-infra                    = infra
