name: Deterministic Rules Review

on:
  # `pull_request`, not `pull_request_target`: the checkout step below still
  # reviews the exact head sha, and running against a fork's diff needs no
  # elevated token or secret now that the reviewer is a local script rather
  # than a model call.
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # A rapid second push cancels the still-running review of the prior push
  # instead of racing it with a duplicate comment.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rules-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Check out the pushed commit explicitly, not GitHub's merge-preview
          # ref and not the author's working tree: the review must judge the
          # commit that will actually land, exactly like CI does.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # No "Set up Python" step: ubuntu-latest ships python3 on PATH already,
      # and scripts/review_rules.py is stdlib-only.

      - name: Run rules review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Actions' default shell is `bash -e`, without pipefail, so the `|
          # tee` below would otherwise report tee's status and swallow a
          # crashing script entirely.
          set -euo pipefail

          # ${REVIEW_CMD:-scripts/review_rules.py} is the swap seam: set
          # REVIEW_CMD in this step's env to drop in a different reviewer
          # without touching the rest of this workflow. The `|| review_status=$?`
          # keeps `-e` from exiting the step immediately on a nonzero reviewer
          # exit, so the VERDICT check and the exit-code branching below still run.
          "${REVIEW_CMD:-scripts/review_rules.py}" | tee review-output.md || review_status=$?
          review_status="${review_status:-0}"

          # Assert on the artifact, not just the exit code. The reviewer's
          # contract requires the report to end with a VERDICT line; if it is
          # absent, no review actually happened, whatever the exit code
          # claimed. (Originally guarded against `claude -p` printing "Not
          # logged in - Please run /login" and exiting 0, measured 2026-08-17.
          # The deterministic reviewer has no such credential, but the same
          # check still guards against a reviewer that crashed or printed
          # nothing before failing.)
          if ! grep -qE '^VERDICT: [0-9]+ critical, [0-9]+ high, [0-9]+ medium, [0-9]+ low' review-output.md; then
            echo "::error::The reviewer produced no VERDICT line, so no review actually ran."
            echo "First 20 lines of what it returned instead:"
            sed -n '1,20p' review-output.md
            exit 1
          fi

          # Deterministic findings are violations of written rules, not model
          # opinions, so they now block the merge. Exit 2 means the reviewer
          # could not run at all (bad env, git error) — an operational
          # failure, distinct from exit 1's "rules were violated".
          if [ "$review_status" -eq 2 ]; then
            echo "::error::Reviewer exited 2: it could not run (operational failure), not a rule violation."
            exit 2
          elif [ "$review_status" -ne 0 ]; then
            echo "::error::Reviewer exited ${review_status}: it found findings that violate written AGENTS.md rules."
            exit "$review_status"
          fi

      - name: Post or update review comment
        # Runs even when the review step above failed — a review that found
        # violations (or one that couldn't run) must still be visible on the
        # PR, not buried in a failed job's logs.
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- rules-review -->';
            const review = fs.readFileSync('review-output.md', 'utf8');
            const body = `${marker}\n## Rules review\n\n${review}`;
            const pullNumber = context.payload.pull_request.number;

            // Update the existing review comment instead of posting a new
            // one on every push, so a fast-moving PR doesn't accumulate a
            // comment per commit.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                body,
              });
            }
